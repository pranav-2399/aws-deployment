services:
  app:
    build: .
    container_name: edu-track-node-js
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=development
      - PORT=3001
      - MONGODB_DB_NAME=Edu-Track
      - MONGODB_LOCAL_URI=mongodb://mongo:27017/Edu-Track
      - KAFKA_CONSUMER_GROUP_ID=edu-track-node-consumer
      - KAFKA_BROKER=kafka:9092
    volumes:
      - .:/app

  mongo:
    image: mongo:8.0
    container_name: edu-track-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: [
          "CMD-SHELL",
          "mongosh --quiet mongodb://localhost:27017/Edu-Track --eval 'db.runCommand({ ping: 1 }).ok' | grep -q 1"
        ]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 20s

volumes:
  mongo-data:


