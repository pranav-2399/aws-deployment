services:
  spring-app:
    extends:
      file: ./backend-spring-boot/docker-compose.yaml
      service: app
    depends_on:
      mysqldb:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - edu-track-network

  nodejs-app:
    extends:
      file: ./backend-node-js/docker-compose.yaml
      service: app
    depends_on:
      mongo:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - edu-track-network

  mysqldb:
    extends:
      file: ./backend-spring-boot/docker-compose.yaml
      service: mysqldb
    networks:
      - edu-track-network

  mongo:
    extends:
      file: ./backend-node-js/docker-compose.yaml
      service: mongo
    networks:
      - edu-track-network

  kafka:
    image: apache/kafka:3.9.1
    container_name: edu-track-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s
    networks:
      - edu-track-network

  kong-database:
    extends:
      file: ./middleware/docker-compose.yaml
      service: kong-database
    networks:
      - edu-track-network

  kong-migrations:
    extends:
      file: ./middleware/docker-compose.yaml
      service: kong-migrations
    depends_on:
      kong-database:
        condition: service_started
    networks:
      - edu-track-network

  kong-gateway:
    extends:
      file: ./middleware/docker-compose.yaml
      service: kong-gateway
    depends_on:
      kong-database:
        condition: service_completed_successfully
      kafka:
        condition: service_healthy
    networks:
      - edu-track-network

volumes:
  mysql-data:
  mongo-data:
  kong-db-data:


networks:
  edu-track-network:
    driver: bridge
